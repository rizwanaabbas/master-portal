name: Dev/Stage Release

# Bank-agnostic staging build. Image tags follow the GitHub repo that triggers the workflow
# (e.g. monfi-bank/monfi-portal or credit-investment-bank/cib-portal or org/portal-master).
# Optional Teams notify when secret TEAMS_WEBHOOK_URL is set.

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      # - main

jobs:
  stg-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Derive image coordinates
        run: |
          ORG=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "ORG=${ORG}" >> $GITHUB_ENV
          echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_ENV
          echo "TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "IMAGE=ghcr.io/${ORG}/${REPO_NAME}" >> $GITHUB_ENV
          echo COMMIT_ID=${GITHUB_SHA::7} >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.ORG }}/${{ env.REPO_NAME }}:${{ env.TAG }}

      - name: Build and push for Nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nginx
          platforms: |
            linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.ORG }}/${{ env.REPO_NAME }}:${{ env.TAG }}-nginx

      - name: Notify MS Teams (Success)
        if: success() && env.TEAMS_WEBHOOK_URL != ''
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"text\": \"✅ STAGING BUILD SUCCESS\\n\\nRepo: ${{ github.repository }}\\nBranch: ${{ github.ref_name }}\\nCommit: ${{ github.sha }}\\nActor: ${{ github.actor }}\\nImage: ${{ env.IMAGE }}:${{ env.TAG }}\"
          }" \
          "$TEAMS_WEBHOOK_URL"

      - name: Notify MS Teams (Failure)
        if: failure() && env.TEAMS_WEBHOOK_URL != ''
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"text\": \"🚨 STAGING BUILD FAILED\\n\\nRepo: ${{ github.repository }}\\nBranch: ${{ github.ref_name }}\\nCommit: ${{ github.sha }}\\nActor: ${{ github.actor }}\"
          }" \
          "$TEAMS_WEBHOOK_URL"
